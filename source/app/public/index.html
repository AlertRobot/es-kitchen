<style>
/* fonts ship with the app (SIL Open Font Licence), so it looks the same offline and needs no outside servers */
@font-face { font-family: "Atkinson Hyperlegible"; src: url("fonts/atkinson-hyperlegible-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: "Atkinson Hyperlegible"; src: url("fonts/atkinson-hyperlegible-latin-700-normal.woff2") format("woff2"); font-weight: 700; font-style: normal; font-display: swap; }
@font-face { font-family: "Atkinson Hyperlegible"; src: url("fonts/atkinson-hyperlegible-latin-400-italic.woff2") format("woff2"); font-weight: 400; font-style: italic; font-display: swap; }
@font-face { font-family: "Bricolage Grotesque"; src: url("fonts/bricolage-grotesque-latin-600-normal.woff2") format("woff2"); font-weight: 600; font-style: normal; font-display: swap; }
@font-face { font-family: "Bricolage Grotesque"; src: url("fonts/bricolage-grotesque-latin-800-normal.woff2") format("woff2"); font-weight: 800; font-style: normal; font-display: swap; }
@font-face { font-family: "IBM Plex Mono"; src: url("fonts/ibm-plex-mono-latin-500-normal.woff2") format("woff2"); font-weight: 500; font-style: normal; font-display: swap; }
@font-face { font-family: "Cinzel"; src: url("fonts/cinzel-latin-700-normal.woff2") format("woff2"); font-weight: 600 900; font-style: normal; font-display: swap; }

@font-face { font-family: "Orbitron"; src: url("fonts/orbitron-latin-700-normal.woff2") format("woff2"); font-weight: 600 900; font-style: normal; font-display: swap; }
@font-face { font-family: "Audiowide"; src: url("fonts/audiowide-latin-400-normal.woff2") format("woff2"); font-weight: 400 900; font-style: normal; font-display: swap; }
@font-face { font-family: "Exo 2"; src: url("fonts/exo-2-latin-700-normal.woff2") format("woff2"); font-weight: 600 900; font-style: normal; font-display: swap; }
html, body { margin: 0; }
html { background: var(--bg); min-height: 100%; }
[hidden] { display: none !important; }
img { max-width: 100%; }
svg { width: 20px; height: 20px; flex: none; vertical-align: middle; }

/* Layout: one-column phone app, max 760px, sticky week header, fixed bottom tab bar; sheets slide over for picking, recipes and cooking. */
:root {
  --bg: #F2F5F0; --surface: #FFFFFF; --surface-2: #E7EDE4; --fg: #15201A; --muted: #56645A; --line: #D3DCD0;
  --accent: #1D6A48; --accent-fg: #FFFFFF; --accent-soft: #D7ECDF;
  --warn: #9A5A12; --warn-soft: #FAEBD7; --bad: #A8271E; --bad-soft: #F7DEDA; --good: #1D6A48;
  --treat: #9B3D12; --treat-soft: #FBE3D3; --t-american: #F3DCDC; --t-italian: #F6E1D6; --t-british: #E2E6F2; --t-mexican: #F7E8C6; --t-middle: #F1DCCB; --t-indian: #F5DDC1; --t-asian: #DDEEE6; --t-other: #E7EDE4;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 14px; --r-sm: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1411; --surface: #171E19; --surface-2: #202923; --fg: #E6ECE7; --muted: #9AA89E; --line: #2B3730;
  --accent: #63C392; --accent-fg: #0A1910; --accent-soft: #1C3A2A;
  --warn: #E7A55C; --warn-soft: #3A2A16; --bad: #F2897E; --bad-soft: #3C1E1B; --good: #63C392;
  --treat: #F3A27A; --treat-soft: #3E2418; --t-american: #3B2326; --t-italian: #3A2A22; --t-british: #262B3A; --t-mexican: #3A3220; --t-middle: #3A2B22; --t-indian: #3B2C1C; --t-asian: #1E3329; --t-other: #202923;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0F1411; --surface: #171E19; --surface-2: #202923; --fg: #E6ECE7; --muted: #9AA89E; --line: #2B3730;
  --accent: #63C392; --accent-fg: #0A1910; --accent-soft: #1C3A2A;
  --warn: #E7A55C; --warn-soft: #3A2A16; --bad: #F2897E; --bad-soft: #3C1E1B; --good: #63C392;
  --treat: #F3A27A; --treat-soft: #3E2418; --t-american: #3B2326; --t-italian: #3A2A22; --t-british: #262B3A; --t-mexican: #3A3220; --t-middle: #3A2B22; --t-indian: #3B2C1C; --t-asian: #1E3329; --t-other: #202923;
  color-scheme: dark; }

* { box-sizing: border-box; }
body { min-height: 100vh; min-height: 100dvh; background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 17px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.01em; }
h2 { font-size: 1.25rem; font-weight: 800; }
h3 { font-size: 1.05rem; font-weight: 600; }
.money, .num { font-family: var(--f-data); font-variant-numeric: tabular-nums; font-size: 0.92em; }
.muted { color: var(--muted); }
.small { font-size: 0.88rem; }
.label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; }

.app { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: calc(8px + env(safe-area-inset-top, 0px)) calc(96px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 18px; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); padding-block: 10px 8px; display: grid; gap: 10px; margin-inline: -16px; padding-inline: 16px; }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.between { justify-content: space-between; }
.stack { display: grid; gap: 10px; }
.grow { flex: 1; min-width: 0; }

.btn { min-height: 48px; padding: 6px 18px; border-radius: 24px; line-height: 1.2; text-align: center; border: 1.5px solid var(--line); background: var(--surface); font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.soft { background: var(--accent-soft); border-color: transparent; color: var(--fg); }
.btn.danger { color: var(--bad); }
.btn.block { width: 100%; }
.btn[disabled] { opacity: 0.55; cursor: default; }
.icon-btn { width: 48px; height: 48px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); display: inline-flex; align-items: center; justify-content: center; flex: none; }
.icon-btn svg, .btn svg { width: 22px; height: 22px; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 12px; white-space: nowrap; flex: none; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 700; font-size: 0.92rem; }
.chip.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; scroll-padding-inline: 16px; }
.chips::-webkit-scrollbar { display: none; }
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: 0.8rem; font-weight: 700; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.tag.swap { background: var(--accent-soft); color: var(--fg); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.bad { background: var(--bad-soft); color: var(--bad); }
.tag.good { background: var(--accent-soft); color: var(--good); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.note { padding: 12px 14px; border-radius: var(--r-sm); background: var(--surface-2); font-size: 0.95rem; }
.note.warn { background: var(--warn-soft); color: var(--fg); }
.note.good { background: var(--accent-soft); }

/* week strip */
.weeknav { display: flex; align-items: center; gap: 8px; }
.weeknav .title { flex: 1; text-align: center; min-width: 0; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 8px 10px; min-width: 0; }
.stat b { display: block; font-family: var(--f-data); font-size: 1.05rem; font-variant-numeric: tabular-nums; }
.stat span { font-size: 0.78rem; color: var(--muted); }
.meter { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; margin-top: 6px; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.meter i.over { background: var(--bad); }

.days { display: grid; gap: 10px; }
.day { display: grid; grid-template-columns: 52px 1fr; gap: 12px; align-items: stretch; }
.day .when { text-align: center; padding-top: 10px; }
.day .when b { display: block; font-family: var(--f-display); font-size: 1.1rem; font-weight: 800; }
.day .when span { font-size: 0.8rem; color: var(--muted); }
.day.today .when b { color: var(--accent); }
.meal { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; padding: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); text-align: left; width: 100%; min-height: 84px; min-width: 0; }
.meal.empty { grid-template-columns: 1fr; border-style: dashed; background: transparent; color: var(--muted); font-weight: 700; justify-items: start; padding-left: 18px; }
.meal .body { min-width: 0; display: grid; gap: 4px; }
.meal .ttl { font-weight: 700; line-height: 1.25; }
.tile { width: 64px; height: 64px; border-radius: 12px; display: grid; place-items: center; font-size: 34px; line-height: 1; flex: none; }
.tile.big { width: 88px; height: 88px; font-size: 48px; border-radius: 18px; }
.c-American { background: var(--t-american); } .c-Italian { background: var(--t-italian); } .c-British { background: var(--t-british); } .c-Mexican { background: var(--t-mexican); }
.c-Middle { background: var(--t-middle); } .c-Indian { background: var(--t-indian); } .c-Asian { background: var(--t-asian); } .c-Other { background: var(--t-other); }
.daynote { grid-column: 2; font-size: 0.88rem; display: flex; gap: 6px; align-items: flex-start; color: var(--muted); }
.daynote svg { width: 16px; height: 16px; margin-top: 2px; }
.daynote.warn { color: var(--warn); }

.leftlist { display: grid; gap: 8px; }
.left { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 10px; align-items: baseline; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.left:last-child { border-bottom: 0; padding-bottom: 0; }

/* recipe list */
.search { width: 100%; min-height: 50px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); padding: 0 18px; }

/* suggestions */
.sugg { display: grid; grid-template-columns: 64px 1fr 48px; gap: 12px; align-items: center; padding: 10px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); min-width: 0; }
.sugg .pick { text-align: left; background: none; border: 0; padding: 0; display: grid; gap: 4px; min-width: 0; }
.sugg.top { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.why { font-size: 0.88rem; color: var(--muted); }
.why b { color: var(--fg); }

/* shop */
.aisle { display: grid; gap: 0; }
.aisle h3 { padding: 8px 0 6px; position: sticky; top: calc(var(--toph, 120px) + env(safe-area-inset-top, 0px)); z-index: 5; background: var(--bg); }
.item { display: grid; grid-template-columns: 48px 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.check { width: 44px; height: 44px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.check.on { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.check svg { width: 22px; height: 22px; }
.item.done .iname { text-decoration: line-through; color: var(--muted); }
.item .iname { font-weight: 700; }
.item .more { background: none; border: 0; padding: 6px 0; text-align: right; min-height: 44px; }
.shopprices { grid-column: 2 / 4; display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; font-size: 0.88rem; padding: 6px 10px; background: var(--surface-2); border-radius: var(--r-sm); min-width: 0; }
.shopprices div { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 8px; }
.compare { display: grid; gap: 10px; }
.cmp { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: baseline; }
.cmp .bar { grid-column: 1 / 3; height: 10px; border-radius: 5px; background: var(--surface-2); overflow: hidden; }
.cmp .bar i { display: block; height: 100%; background: var(--muted); opacity: 0.55; border-radius: 5px; }
.cmp.best .bar i { background: var(--accent); opacity: 1; }
.cmp.best .sname { font-weight: 700; }

/* forms */
.field { display: grid; gap: 6px; }
.field > span { font-weight: 700; font-size: 0.92rem; }
.input, select.input, textarea.input { min-height: 48px; border-radius: var(--r-sm); border: 1.5px solid var(--line); background: var(--surface); padding: 8px 12px; width: 100%; min-width: 0; }
textarea.input { min-height: 72px; resize: vertical; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface); }
.seg { flex: none; }
.seg button { min-height: 44px; padding: 0 14px; border: 0; background: none; font-weight: 700; white-space: nowrap; }
.seg button.on { background: var(--fg); color: var(--bg); }
.pricetable { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
.pricetable th { text-align: left; font-size: 0.75rem; color: var(--muted); font-weight: 700; padding: 4px; }
.pricetable td { padding: 4px; vertical-align: middle; }
.pricetable input { width: 100%; min-width: 64px; min-height: 40px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface); padding: 4px 8px; font-family: var(--f-data); }
.scrollx { overflow-x: auto; }
.prow { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; text-align: left; min-height: 56px; }
.pchips { display: flex; flex-wrap: wrap; gap: 6px; }
.pchips .chip { min-height: 36px; padding: 0 6px 0 12px; }
.pchips .chip button { border: 0; background: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); }

/* bottom nav */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--bg); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.nav .in { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.nav button { border: 0; background: none; min-height: 62px; min-width: 0; display: grid; justify-items: center; align-content: center; gap: 3px; font-size: min(0.75rem, 3.6vw); font-weight: 700; color: var(--muted); }
.nav button svg { width: 24px; height: 24px; }
.nav button.on { color: var(--accent); }

/* sheets */
.sheet { position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; }
.sheet .shead { position: sticky; top: 0; z-index: 2; background: var(--bg); padding-top: env(safe-area-inset-top, 0px); border-bottom: 1px solid var(--line); }
.sheet .shead .in { max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 10px; min-height: 64px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.sheet .sbody { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px calc(40px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 18px; }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up 0.18s ease-out; } @keyframes up { from { transform: translateY(16px); opacity: 0.6; } } }

.ings { display: grid; gap: 0; }
.ing { display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.ing:last-child { border-bottom: 0; }
.ing .amt { text-align: right; color: var(--muted); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; counter-reset: s; }
.steps li { display: grid; grid-template-columns: 40px 1fr; gap: 12px; counter-increment: s; font-size: 1.05rem; }
.steps li::before { content: counter(s); width: 40px; height: 40px; border-radius: 50%; background: var(--fg); color: var(--bg); display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; }

.cook { position: fixed; inset: 0; height: 100vh; height: 100dvh; z-index: 60; background: var(--bg); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.cook .chead, .cook .cfoot { display: flex; align-items: center; gap: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; max-width: 900px; width: 100%; margin: 0 auto; }
.cook .cbody { overflow-y: auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); max-width: 900px; width: 100%; margin: 0 auto; display: grid; align-content: start; align-content: safe center; gap: 18px; min-height: 0; padding-block: 8px 20px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.cook .stepno { font-family: var(--f-display); font-weight: 800; font-size: 1rem; color: var(--accent); text-transform: uppercase; letter-spacing: 0.08em; }
.cook .steptext { font-size: clamp(1.5rem, 5.5vw, 2.4rem); line-height: 1.35; font-weight: 700; }
.cook .cfoot .btn { flex: 1; min-height: 64px; font-size: 1.1rem; }
.dots { display: flex; gap: 6px; flex: 1; justify-content: center; }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--accent); }

.toast { position: fixed; left: 16px; right: 16px; margin: 0 auto; width: fit-content; max-width: min(460px, calc(100% - 32px)); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); z-index: 80; background: var(--fg); color: var(--bg); padding: 12px 18px; border-radius: 18px; font-weight: 700; line-height: 1.3; text-align: center; box-shadow: 0 6px 24px rgba(0,0,0,0.25); }
.empty-state { text-align: center; padding: 30px 10px; display: grid; gap: 10px; justify-items: center; }
.spinner { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); }
@media (prefers-reduced-motion: no-preference) { .spinner { animation: spin 0.8s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } } }
details > summary { cursor: pointer; font-weight: 700; min-height: 44px; display: flex; align-items: center; }

/* ---- v2 additions ---- */
.tile.photo { overflow: hidden; background: var(--surface-2); }
.tile.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.hero { margin: 0; border-radius: var(--r); overflow: hidden; background: var(--surface-2); }
.hero img { width: 100%; max-height: 52vh; object-fit: cover; display: block; aspect-ratio: 4 / 3; }
.hero figcaption { font-size: 0.75rem; color: var(--muted); padding: 6px 10px; }
.hero figcaption a { color: inherit; }

/* slim totals line, one-button action rows and pop-down menus */
.statline { display: flex; justify-content: center; flex-wrap: wrap; gap: 4px 16px; background: none; border: 0; padding: 2px 0 0; color: var(--muted); font-size: 0.9rem; min-height: 32px; }
.statline b { color: var(--fg); font-size: 1rem; }
.meter.slim { height: 3px; margin: 0 auto; width: min(260px, 70%); }
.lockline { display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 14px; border-radius: 999px; background: var(--accent-soft); font-size: 0.95rem; }
/* asking "Unlock?": the two buttons go under the name when they don't fit beside it */
.lockline:has(.btn) { flex-wrap: wrap; row-gap: 6px; border-radius: var(--r); padding: 8px 12px; }
.tonight.slim { padding: 10px 12px; gap: 0; }
/* calmer Week layouts */
.day .when .whochip { margin: 6px auto 0; }
.whochip { display: flex; flex-wrap: wrap; justify-content: center; max-width: 100%; gap: 2px 0; margin-top: 6px; padding: 2px; border-radius: 15px; border: 1px solid var(--line); background: var(--surface); min-height: 30px; align-items: center; }
/* (the initials overlap a little, so three of you still fit the day's column) */
.whochip i + i { margin-left: -7px; box-shadow: 0 0 0 2px var(--surface); }
.whochip i { font-style: normal; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 0.72rem; font-weight: 700; background: var(--accent); color: var(--accent-fg); }

.weekfoot { display: grid; gap: 8px; padding-top: 4px; }

/* ---------- navigation: page headers, menus, section switchers ---------- */

/* full-width segments share the room by how long their labels are, each on one line */

.seg .count { font-family: var(--f-data); font-size: 0.78rem; opacity: 0.75; margin-left: 4px; }

.jump::-webkit-scrollbar { display: none; }

.aisle, [id^="sec-"] { scroll-margin-top: calc(150px + env(safe-area-inset-top, 0px)); }
details.fold { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }

details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::after { content: "\25BE"; color: var(--muted); }
details.fold[open] > summary::after { content: "\25B4"; }
details.fold > .in { padding: 0 16px 16px; display: grid; gap: 10px; }

/* recipe carousels and photo cards */
.shelf { display: grid; gap: 8px; min-width: 0; }
.shelf .row h2 { font-size: 1.1rem; }
.carousel { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(max(150px, 9.5rem), 42%); gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; margin-inline: -16px; padding: 2px 16px 6px; scroll-padding-inline: 16px; }
.carousel::-webkit-scrollbar { display: none; }

.carousel > * { scroll-snap-align: start; }
.vgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 620px) { .vgrid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.vcard { display: grid; grid-template-rows: auto 1fr; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); overflow: hidden; text-align: left; padding: 0; min-width: 0; width: 100%; }

.vcard .vtag { position: absolute; left: 8px; bottom: 8px; max-width: calc(100% - 16px); white-space: normal; line-height: 1.2; padding-block: 3px; border-radius: 10px; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }

.dot.good { background: var(--good); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 0.9rem; }

.themegrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }

.theme .tname b { font-size: 0.95rem; } .theme .tname span { font-size: 0.78rem; color: var(--muted); }


/* thumbs up or down, plates, calories at a glance, use-it-up, batch prep, history */
.votebtns { display: inline-flex; gap: 6px; }
.vbtn { min-width: 44px; min-height: 40px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); font-size: 1.1rem; filter: grayscale(1); opacity: 0.75; }
.vbtn.on { filter: none; opacity: 1; }

.mb-track i.paid { left: 22%; right: 22%; background: var(--accent); }

.key { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: middle; }
.key.plan { background: var(--surface-2); border: 1px dashed var(--muted); }
.key.paid { background: var(--accent); }
.cuisbar { display: grid; grid-template-columns: 110px 1fr 40px; gap: 8px; align-items: center; }
.cuisbar .bar { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.cuisbar .bar i { display: block; height: 100%; background: var(--accent); }
.histrow { gap: 10px; padding: 8px 0; }
.srclist { margin: 4px 0 0; padding-left: 18px; display: grid; gap: 2px; }
.lsrow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.lsrow .input { min-width: 0; width: 100%; }
